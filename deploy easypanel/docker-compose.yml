version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: deploy easypanel/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - BARBERLY_EMAIL=${BARBERLY_EMAIL}
      - BARBERLY_PASSWORD=${BARBERLY_PASSWORD}
    volumes:
      - whatsapp_auth:/app/auth
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  whatsapp_auth:
  sqlite_data:
