name: Deploy to EasyPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger EasyPanel deploy
        run: |
          curl -f -X POST "${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}" \
            -H "Content-Type: application/json" || echo "Webhook call failed"
